name: Test CI

on:
  push:


jobs:
  build:

    name: Build and test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.16.3'
            otp: '26'
          - elixir: '1.17.3'
            otp: '27'
          - elixir: '1.18.4'
            otp: '28'
          - elixir: '1.19.5'
            otp: '28'

    steps:
    - uses: actions/checkout@v6
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}
    - name: Restore dependencies cache
      uses: actions/cache@v5
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-elixir-${{ matrix.elixir }}-otp-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-elixir-${{ matrix.elixir }}-otp-${{ matrix.otp }}-
    - name: Install dependencies
      run: |
        mix local.rebar --force
        mix local.hex --force
        mix deps.get
        mix deps.compile
        mix dialyzer --plt
    - name: Run format
      run: mix format --check-formatted
    - name: Run Credo
      run: mix credo
    - name: Run dialyzer
      run: mix dialyzer
    - name: Run tests
      run: mix test
    - name: mix clean
      run: mix clean
