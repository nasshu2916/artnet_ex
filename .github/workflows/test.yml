name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.15.8'
            otp: '26'
          - elixir: '1.16.3'
            otp: '26'
          - elixir: '1.17.3'
            otp: '27'
          - elixir: '1.18.4'
            otp: '28'
          - elixir: '1.19.5'
            otp: '28'
          - elixir: '1.20.1'
            otp: '29'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore Mix cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-mix-elixir-${{ matrix.elixir }}-otp-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-elixir-${{ matrix.elixir }}-otp-${{ matrix.otp }}-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix deps.compile

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test

      - name: Run Credo
        run: mix credo

      - name: Build Dialyzer PLT
        run: mix dialyzer --plt

      - name: Run Dialyzer
        run: mix dialyzer
